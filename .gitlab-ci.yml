# Same checks as .github/workflows/ci.yml.
stages: [check]

check:
  stage: check
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      ca-certificates curl git jq python3 shellcheck shfmt nodejs qt6-declarative-dev-tools
    - arch=$(uname -m); case $arch in x86_64) ga=x64 ;; aarch64) ga=arm64 ;; *) ga=$arch ;; esac
    - curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${ga}.tar.gz"
    - tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - scripts/check.sh --strict
